<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Module 4 HTML Assignment</title>
  <style>
    /* Simple Styling */
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    nav ul {
      list-style-type: none;
      padding: 0;
      background-color: #f0f0f0;
      display: flex;
      gap: 10px;
      border-radius: 5px;
    }

    nav ul li {
      padding: 10px;
    }

    form {
      margin-top: 20px;
    }

    input, textarea {
      display: block;
      margin-bottom: 10px;
      padding: 8px;
      width: 100%;
      max-width: 400px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    table {
      margin-top: 20px;
      border-collapse: collapse;
      width: 100%;
      max-width: 600px;
    }

    table, th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: left;
    }

    img {
      margin-top: 20px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <!-- Navigation Bar -->
  <nav>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

  <!-- Contact Form -->
  <form>
    <h2>Contact Us</h2>
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required />

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required />

    <label for="message">Message:</label>
    <textarea id="message" name="message" rows="5" required></textarea>

    <input type="submit" value="Submit" />
  </form>

  <!-- Product Table -->
  <table>
    <thead>
      <tr>
        <th>Product Name</th>
        <th>Price</th>
        <th>Quantity</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Wireless Mouse</td>
        <td>$15.99</td>
        <td>25</td>
      </tr>
      <tr>
        <td>USB Keyboard</td>
        <td>$22.50</td>
        <td>12</td>
      </tr>
      <tr>
        <td>HD Monitor</td>
        <td>$199.99</td>
        <td>8</td>
      </tr>
    </tbody>
  </table>

  <!--Placeholder Image -->
  <img src="https://placehold.co/300x200" alt="Placeholder Image" />

</body>
</html>
